name: Continuous Integration Demo
 
on:
  push:
    branches: ["main"]
  workflow_dispatch:
 
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
 
      - name: Restore dependencies
        run: dotnet restore SimpleCalculator.csproj
 
      - name: Build
        run: dotnet build SimpleCalculator.csproj --configuration Release --no-restore
 
      # Optional: run tests if/when you add a test project
      # - name: Test
      #   run: dotnet test --no-build --configuration Release
 
      - name: dotnet Publish
        run: dotnet publish SimpleCalculator.csproj --configuration Release --no-build --output ./publish

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simplecalculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simplecalculator:${{ github.sha }}
 
      - name: Upload publish artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCalculator-artifact
          path: ./publish
          retention-days: 7
